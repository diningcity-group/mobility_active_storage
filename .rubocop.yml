# Without this, AllCops/Exclude below *replaces* RuboCop's defaults rather than adding to
# them -- dropping vendor/**/*, which CI populates via bundler-cache and which contains other
# gems' .rubocop.yml files.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    # Standalone reproduction scripts for upstream reports, written to be pasted
    # into an issue rather than to match this gem's style.
    - "docs/**/*"


Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The macros deliberately mirror Rails' own has_one_attached / has_many_attached.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_one_translated_attached
    - has_many_translated_attached
    - has_one_attached
    - has_many_attached

Metrics/MethodLength:
  Max: 15

# Tests read better as flat sequences of setup and assertions.
Metrics:
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"

Lint/AmbiguousBlockAssociation:
  Exclude:
    - "test/**/*"
