name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.2', name: 'Rails 7.0.8', gemfile: gemfiles/rails_7.0.8.gemfile }
          - { ruby: '3.3', name: 'Rails 7.0.8', gemfile: gemfiles/rails_7.0.8.gemfile }
          - { ruby: '3.3', name: 'Rails 8.0', gemfile: gemfiles/rails_8.0.gemfile }
          - { ruby: '3.4', name: 'Rails 8.0', gemfile: gemfiles/rails_8.0.gemfile }
          - { ruby: '3.4', name: 'Rails latest', gemfile: Gemfile }
          # Newest Ruby against both ends of the supported Rails range.
          - { ruby: '4.0', name: 'Rails 7.0.8', gemfile: gemfiles/rails_7.0.8.gemfile }
          - { ruby: '4.0', name: 'Rails latest', gemfile: Gemfile }
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    name: RuboCop

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  audit:
    runs-on: ubuntu-latest
    name: Dependency audit

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Check resolved dependencies for known advisories
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update
